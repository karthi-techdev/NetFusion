[package]
name = "netfusion-installer"
version = "0.1.0"
edition = "2021"
authors = ["NetFusion Engineering Team"]
description = "NetFusion Standalone Windows Installer"

[[bin]]
name = "NetFusion-Setup"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
