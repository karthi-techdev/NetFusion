[package]
name = "netfusion-core"
version = "0.1.0"
edition = "2021"
authors = ["NetFusion Engineering Team"]
description = "Core protocol, crypto, reordering, and adaptive multipath scheduling engine"

[dependencies]
chacha20poly1305 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
thiserror = "1.0"
parking_lot = "0.12"
log = "0.4"
rand = "0.8"
bitflags = "2.5"
tokio = { version = "1.37", features = ["sync", "time", "rt", "macros"] }
