[package]
name = "netfusion-cli"
version = "0.1.0"
edition = "2021"
authors = ["NetFusion Engineering Team"]
description = "NetFusion command line diagnostics, interface inspection, and benchmark utility"

[dependencies]
netfusion-core = { path = "../netfusion-core" }
tokio = { version = "1.37", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
reqwest = { version = "0.12", features = ["stream"] }
