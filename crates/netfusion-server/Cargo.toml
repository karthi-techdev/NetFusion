[package]
name = "netfusion-server"
version = "0.1.0"
edition = "2021"
authors = ["NetFusion Engineering Team"]
description = "High-performance Linux multipath bonding server and Layer-3 forwarding engine"

[dependencies]
netfusion-core = { path = "../netfusion-core" }
tokio = { version = "1.37", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
