[workspace]
members = [
    "crates/netfusion-core",
    "crates/netfusion-client",
    "crates/netfusion-server",
    "crates/netfusion-gui",
    "crates/netfusion-cli",
    "crates/netfusion-installer",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
